# Trading Configuration
trading:
  symbol: "BANKNIFTY"
  exchange: "NSE"
  timeframes:
    primary: "5min"
    secondary: "15min"
    filter: "1hour"
  lookback_bars: 2000
  
# Signal Settings
signals:
  ml_neighbors: 8
  feature_count: 5
  use_kernel_filter: true
  min_confidence: 4  # Minimum prediction strength
  
# Volume Node Settings
volume:
  lookback_period: 200
  volume_threshold: 1.5  # Multiple of average
  
# Exit Settings
exits:
  use_volume_nodes: true
  default_target_pct: 2.0
  default_stop_pct: 1.5
  max_bars_held: 10
  
# Risk Management
risk:
  position_size: 15  # Lots
  max_positions: 1
  daily_loss_limit: 5000  # INR
  
# Contract Rollover
rollover:
  auto_rollover: true
  days_before_expiry: 3
